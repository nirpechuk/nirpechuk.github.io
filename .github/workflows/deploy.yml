name: Redirect old GitHub Pages URLs
on:
  push:
    branches: [main]
    paths:
      [
        "hosting/redirect-paths.json",
        "hosting/scripts/redirects.mjs",
        "hosting/legacy-flats.html",
        "hosting/legacy-research.html",
        "assets/research/handoff.js",
        "hosting/migration-crypto.mjs",
        ".github/workflows/deploy.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  build:
    if: vars.CLOUDFLARE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node hosting/scripts/redirects.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/redirects
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
