    <style>
      /* Dartmouth's Forest Green and Snow White. */
      :root {
        --bg: #12312b;
        --ink: #ffffff;
        --link: var(--ink);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Atkinson Hyperlegible",
          ui-sans-serif,
          -apple-system,
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.1rem;
        padding: 0 1.5rem 8vh;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 4.6vw, 4.2rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem 1.1rem;
        font-size: 0.95rem;
      }
      nav a {
        color: var(--link);
        text-underline-offset: 4px;
        text-decoration-thickness: 1px;
        border-radius: 2px;
      }
      nav a:hover {
        text-decoration-thickness: 2px;
      }
      nav a:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 4px;
      }

      /* The arms are drawn over the page and never take a click from it. They
         come in once they are ready, so the text is never waiting on them. */
      #arms {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 3;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      body.ready #arms {
        opacity: 1;
      }
      /* A piece of the page the arms can pick up. */
      .piece {
        display: inline-block;
        position: relative;
        will-change: transform;
        user-select: none;
      }
      .piece.loose,
      .piece.held {
        z-index: 2;
      }
      .piece.held {
        filter: drop-shadow(0 5px 6px rgba(0, 0, 0, 0.25));
      }
    </style>
