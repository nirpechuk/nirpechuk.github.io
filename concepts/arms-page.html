<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Concept: arms on the page · Nir Pechuk</title>
    <meta name="robots" content="noindex" />
    <style>
      /* The page brings its own stylesheets; this is only what the arms need. */
      #arms {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1040; /* in front of everything, the page's fixed bar included */
        pointer-events: none;
      }
      .piece {
        position: relative;
        will-change: transform;
        user-select: none;
      }
      span.piece,
      a.piece {
        display: inline-block;
      }
      .piece.loose,
      .piece.held {
        z-index: 1035;
      }
      .piece.held {
        filter: drop-shadow(0 5px 6px rgba(0, 0, 0, 0.22));
      }
      /* A bar of its own at the foot of the window, so it never fights the page. */
      .switch {
        position: fixed;
        z-index: 1050;
        bottom: 0.75rem;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100vw - 2rem);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.2rem 0.9rem;
        padding: 0.5rem 0.9rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-family:
          ui-sans-serif,
          -apple-system,
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        background: var(--global-bg-color, #fff);
        border: 1px solid var(--global-divider-color, rgba(0, 0, 0, 0.12));
        box-shadow: 0 2px 14px rgba(0, 0, 0, 0.09);
        color: var(--global-text-color-light, #777);
      }
      .switch a {
        color: inherit;
        text-decoration: none;
        white-space: nowrap;
      }
      .switch a:hover {
        color: var(--global-theme-color, #06c);
      }
      .switch a[aria-current="page"] {
        color: var(--global-text-color, #111);
        text-decoration: underline;
      }
      @media (max-width: 640px) {
        .switch {
          left: 0.75rem;
          right: 0.75rem;
          max-width: none;
          transform: none;
          flex-wrap: nowrap;
          overflow-x: auto;
          justify-content: flex-start;
          border-radius: 10px;
          font-size: 0.7rem;
          padding: 0.4rem 0.7rem;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "matter-js": "https://cdn.jsdelivr.net/npm/matter-js@0.20.0/+esm"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="arms" aria-hidden="true"></canvas>
    <nav class="switch"></nav>
    <script type="module" src="nav.mjs"></script>

    <script type="module" src="arms-page.mjs"></script>
  </body>
</html>
