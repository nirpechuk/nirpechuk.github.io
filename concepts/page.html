<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Concept: page · Nir Pechuk</title>
    <meta name="robots" content="noindex" />
    <style>
      /* The page brings its own stylesheets; this is only what the overlay needs. */
      #sand {
        position: fixed;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }
      /* A bar of its own at the foot of the window, so it never fights the page. */
      .switch {
        position: fixed;
        z-index: 4;
        bottom: 0.75rem;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100vw - 2rem);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.2rem 0.9rem;
        padding: 0.5rem 0.9rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-family:
          ui-sans-serif,
          -apple-system,
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        background: var(--global-bg-color, #fff);
        border: 1px solid var(--global-divider-color, rgba(0, 0, 0, 0.12));
        box-shadow: 0 2px 14px rgba(0, 0, 0, 0.09);
        color: var(--global-text-color-light, #777);
      }
      .switch a {
        color: inherit;
        text-decoration: none;
        white-space: nowrap;
      }
      .switch a:hover {
        color: var(--global-theme-color, #06c);
      }
      .switch a[aria-current="page"] {
        color: var(--global-text-color, #111);
        text-decoration: underline;
      }
      /* On a narrow screen one scrolling row, so it does not cover the page. */
      @media (max-width: 640px) {
        .switch {
          left: 0.75rem;
          right: 0.75rem;
          max-width: none;
          transform: none;
          flex-wrap: nowrap;
          overflow-x: auto;
          justify-content: flex-start;
          border-radius: 10px;
          font-size: 0.7rem;
          padding: 0.4rem 0.7rem;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="sand" aria-hidden="true"></canvas>
    <nav class="switch"></nav>
    <script type="module" src="nav.mjs"></script>

    <script type="module" src="page.mjs"></script>
  </body>
</html>
