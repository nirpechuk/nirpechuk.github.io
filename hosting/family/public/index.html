<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="The Pechuk family’s corner of the web." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://pechuk.com/" />
    <title>Pechuk</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #fff;
        --ink: #171b29;
        --muted: #667085;
        --link: #3058c9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          17px/1.6 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      main {
        width: min(100% - 48px, 420px);
        margin: clamp(72px, 18vh, 180px) auto 48px;
      }
      h1 {
        margin: 0;
        font:
          400 clamp(48px, 10vw, 64px)/1.15 Georgia,
          "Times New Roman",
          serif;
        letter-spacing: -2px;
      }
      p {
        margin: 12px 0 40px;
        color: var(--muted);
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li + li {
        margin-top: 24px;
      }
      a {
        display: inline-flex;
        flex-direction: column;
        padding: 4px 0;
        color: var(--link);
        text-decoration: none;
      }
      .name {
        font-size: 20px;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 5px;
      }
      .domain {
        margin-top: 3px;
        color: var(--muted);
        font-size: 14px;
      }
      a:hover .name {
        text-decoration-thickness: 2px;
      }
      a:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 6px;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pechuk</h1>
      <p>Family websites.</p>
      <nav aria-label="Family websites">
        <ul>
          <li>
            <a href="https://nir.pechuk.com/"><span class="name">Nir</span><span class="domain">nir.pechuk.com</span></a>
          </li>
        </ul>
      </nav>
    </main>
  </body>
</html>
